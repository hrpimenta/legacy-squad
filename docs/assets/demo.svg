<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <!-- Terminal window background -->
  <rect width="900" height="470" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="900" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="900" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="66" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-size="13">legacy-squad — install</text>

  <!-- Terminal content -->
  <g transform="translate(24, 72)">

    <!-- L1: cd legacy-mobile-app (t=0s) -->
    <g>
      <text fill="#7ee787">$</text>
      <text x="18" fill="#c9d1d9">cd legacy-mobile-app</text>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L2: npx legacy-squad install (t=0.7s) -->
    <g opacity="0">
      <text y="28" fill="#7ee787">$</text>
      <text x="18" y="28" fill="#c9d1d9">npx legacy-squad install</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.054;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L3: Banner (t=1.5s) -->
    <g opacity="0">
      <text y="68" fill="#ffd700">⚡ Legacy Squad Framework</text>
      <text x="216" y="68" fill="#8b949e">v1.0.0-beta.4</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.115;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L4: Stack detected (t=2.2s) -->
    <g opacity="0">
      <text y="104" fill="#56d364">✓</text>
      <text x="22" y="104" fill="#c9d1d9">Stack detected:</text>
      <text x="160" y="104" fill="#79c0ff">React Native + TypeScript</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.169;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L5: Scanner (t=2.9s) -->
    <g opacity="0">
      <text y="130" fill="#56d364">✓</text>
      <text x="22" y="130" fill="#c9d1d9">Scanner:</text>
      <text x="98" y="130" fill="#79c0ff">18,247</text>
      <text x="156" y="130" fill="#c9d1d9">LoC ·</text>
      <text x="206" y="130" fill="#79c0ff">98</text>
      <text x="234" y="130" fill="#c9d1d9">dependencies ·</text>
      <text x="350" y="130" fill="#79c0ff">24</text>
      <text x="372" y="130" fill="#c9d1d9">modules</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.223;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L6: Compliance Engine (t=3.6s) -->
    <g opacity="0">
      <text y="156" fill="#56d364">✓</text>
      <text x="22" y="156" fill="#c9d1d9">Compliance Engine:</text>
      <text x="178" y="156" fill="#79c0ff">7</text>
      <text x="195" y="156" fill="#c9d1d9">deterministic findings (OWASP / CWE)</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.277;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L7: Context Packs (t=4.3s) -->
    <g opacity="0">
      <text y="182" fill="#56d364">✓</text>
      <text x="22" y="182" fill="#c9d1d9">Context Packs:</text>
      <text x="148" y="182" fill="#79c0ff">12</text>
      <text x="170" y="182" fill="#c9d1d9">modules indexed</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.331;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L8: Agents installed (t=5.0s) -->
    <g opacity="0">
      <text y="208" fill="#56d364">✓</text>
      <text x="22" y="208" fill="#c9d1d9">Agents installed:</text>
      <text x="172" y="208" fill="#79c0ff">9</text>
      <text x="190" y="208" fill="#c9d1d9">slash commands</text>
      <text x="316" y="208" fill="#8b949e">→ .claude/commands/legacy-squad/</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.385;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L9: Next step comment (t=6.0s) -->
    <g opacity="0">
      <text y="252" fill="#8b949e"># Next step — open your IDE and run:</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.462;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L10: claude (t=6.7s) -->
    <g opacity="0">
      <text y="280" fill="#7ee787">$</text>
      <text x="18" y="280" fill="#c9d1d9">claude</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.515;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- L11: /legacy-squad-security (t=7.4s) -->
    <g opacity="0">
      <text y="306" fill="#7ee787">$</text>
      <text x="18" y="306" fill="#d2a8ff">/legacy-squad-security</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.569;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

    <!-- Cursor (appears at t=7.4s, blinks until fade out) -->
    <g opacity="0">
      <rect x="200" y="293" width="9" height="16" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.569;0.977;1" dur="13s" repeatCount="indefinite"/>
    </g>

  </g>

  <!-- Footer caption (always visible) -->
  <text x="450" y="445" text-anchor="middle" fill="#6e7681" font-size="12">Zero API keys · Zero external servers · Runs in your own IDE</text>
</svg>